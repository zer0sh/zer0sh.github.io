<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .text-title { font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.05em; }
    .text-prompt-user { font-size: 13px; fill: #10b981; font-weight: bold; }
    .text-prompt-at { font-size: 13px; fill: #64748b; }
    .text-prompt-host { font-size: 13px; fill: #38bdf8; font-weight: bold; }
    .text-prompt-path { font-size: 13px; fill: #f59e0b; }
    .text-prompt-cmd { font-size: 13px; fill: #f1f5f9; }
    .text-header { font-size: 12px; fill: #64748b; font-weight: bold; }
    .text-row-legit { font-size: 12px; fill: #e2e8f0; }
    .text-row-bad { font-size: 12px; fill: #fca5a5; }
    .text-id-bad { font-size: 12px; fill: #ef4444; font-weight: bold; }
    .text-email-bad { font-size: 12px; fill: #ef4444; font-weight: bold; text-decoration: underline; }
    .text-tag-bad { font-size: 11px; fill: #ef4444; font-weight: bold; }
    .text-comment { font-size: 12px; fill: #64748b; font-style: italic; }
    .text-alert { font-size: 12px; fill: #fbbf24; font-weight: bold; }
  </style>

  <!-- Ventana Exterior -->
  <rect x="20" y="20" width="1060" height="540" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#windowShadow)"/>

  <!-- Barra de Encabezado -->
  <path d="M 20 30 Q 20 20 30 20 L 1070 20 Q 1080 20 1080 30 L 1080 62 L 20 62 Z" fill="url(#headerGrad)"/>
  <line x1="20" y1="62" x2="1080" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Botones de Control -->
  <circle cx="44" cy="41" r="6" fill="#ef4444"/>
  <circle cx="64" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="41" r="6" fill="#10b981"/>

  <!-- Título -->
  <text x="550" y="45" text-anchor="middle" class="font-mono text-title">terminus @ arquia-portal.live — WP-CLI Security Audit</text>

  <!-- Badge -->
  <rect x="920" y="32" width="140" height="20" rx="3" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="990" y="46" text-anchor="middle" class="font-mono" font-size="10" fill="#ef4444" font-weight="bold" letter-spacing="0.1em">11 FAKE ADMINS</text>

  <!-- Contenido de Terminal -->
  <g class="font-mono" transform="translate(45, 95)">
    <!-- Prompt -->
    <text x="0" y="0">
      <tspan class="text-prompt-user">operator</tspan>
      <tspan class="text-prompt-at">@</tspan>
      <tspan class="text-prompt-host">pantheon-bastion</tspan>
      <tspan class="text-prompt-at">:</tspan>
      <tspan class="text-prompt-path">~/code/web</tspan>
      <tspan class="text-prompt-user">$</tspan>
      <tspan class="text-prompt-cmd"> terminus wp arquia-portal.live -- user list --role=administrator --fields=ID,user_login,user_email,user_registered</tspan>
    </text>

    <!-- Table Header -->
    <text x="0" y="32" class="text-header">+----+----------------------+------------------------------------+---------------------+</text>
    <text x="0" y="52" class="text-header">| ID | user_login           | user_email                         | user_registered     |</text>
    <text x="0" y="72" class="text-header">+----+----------------------+------------------------------------+---------------------+</text>

    <!-- Row 1: Legit -->
    <text x="0" y="96" class="text-row-legit">| 1  | admin_principal      | lead-systems@arquia-org.invalid    | 2023-04-12 14:22:10 |  [LEGÍTIMO]</text>

    <!-- Row 2: Malicious -->
    <text x="0" y="122">
      <tspan class="text-row-bad">| </tspan><tspan class="text-id-bad">4</tspan><tspan class="text-row-bad">  | wp2_389809           | </tspan><tspan class="text-email-bad">wp2_389809@wp2shell.invalid</tspan><tspan class="text-row-bad">        | 2026-07-19 23:57:04 |  </tspan><tspan class="text-tag-bad">[INTRUSIÓN CVE]</tspan>
    </text>

    <!-- Row 3: Malicious -->
    <text x="0" y="148">
      <tspan class="text-row-bad">| </tspan><tspan class="text-id-bad">5</tspan><tspan class="text-row-bad">  | wpsvc_sec            | </tspan><tspan class="text-email-bad">wpsvc_081@wordpress-svc.internal</tspan><tspan class="text-row-bad">   | 2026-07-20 01:14:19 |  </tspan><tspan class="text-tag-bad">[BOT INYECCIÓN]</tspan>
    </text>

    <!-- Row 4: Malicious -->
    <text x="0" y="174">
      <tspan class="text-row-bad">| </tspan><tspan class="text-id-bad">6</tspan><tspan class="text-row-bad">  | seomanager2026       | </tspan><tspan class="text-email-bad">seomanager2026@mail.com</tspan><tspan class="text-row-bad">             | 2026-07-20 02:40:11 |  </tspan><tspan class="text-tag-bad">[SEO SPAMMER]</tspan>
    </text>

    <!-- Row 5: Malicious -->
    <text x="0" y="200">
      <tspan class="text-row-bad">| </tspan><tspan class="text-id-bad">7</tspan><tspan class="text-row-bad">  | ahmetkaya            | </tspan><tspan class="text-email-bad">ahmetkaya@gmail.com</tspan><tspan class="text-row-bad">                 | 2026-07-20 04:08:52 |  </tspan><tspan class="text-tag-bad">[CUENTA C2]</tspan>
    </text>

    <!-- Row 6: Truncated bad -->
    <text x="0" y="226" class="text-comment">| .. | [6 cuentas más con dominios falsos creadas entre 07-20 y 07-21]                       |</text>

    <text x="0" y="250" class="text-header">+----+----------------------+------------------------------------+---------------------+</text>

    <!-- Alert notes -->
    <text x="0" y="285" class="text-alert">[!] HALLAZGO CLAVE:</text>
    <text x="0" y="310" class="text-comment">1. Las cuentas sobrevivieron porque se crearon 2 días ANTES de que el Autopilot subiera WP Core a 7.0.2.</text>
    <text x="0" y="334" class="text-comment">2. La opción 'template' y 'stylesheet' en wp_options quedó vacía tras el barrido de permisos → HTTP 200 (0 bytes).</text>
    <text x="0" y="358" class="text-comment">3. Intento de subida de 10 backdoors PHP renombrados por sanitize_file_name() a '.php_.gif' en uploads/.</text>
  </g>
</svg>
