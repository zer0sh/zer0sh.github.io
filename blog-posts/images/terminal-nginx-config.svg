<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .text-title { font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.05em; }
    .text-prompt-user { font-size: 13px; fill: #10b981; font-weight: bold; }
    .text-prompt-at { font-size: 13px; fill: #64748b; }
    .text-prompt-host { font-size: 13px; fill: #38bdf8; font-weight: bold; }
    .text-prompt-path { font-size: 13px; fill: #f59e0b; }
    .text-prompt-cmd { font-size: 13px; fill: #f1f5f9; }
    .text-line-num { font-size: 12px; fill: #475569; text-anchor: end; user-select: none; }
    .text-comment { font-size: 12.5px; fill: #64748b; font-style: italic; }
    .text-alert-comment { font-size: 12.5px; fill: #f87171; font-weight: bold; }
    .text-keyword { font-size: 12.5px; fill: #f43f5e; font-weight: 600; }
    .text-directive { font-size: 12.5px; fill: #38bdf8; }
    .text-param { font-size: 12.5px; fill: #e2e8f0; }
    .text-highlight { font-size: 12.5px; fill: #fbbf24; font-weight: bold; }
    .text-ip { font-size: 12.5px; fill: #ef4444; font-weight: bold; text-decoration: underline; }
    .text-var { font-size: 12.5px; fill: #a78bfa; }
    .text-semicolon { font-size: 12.5px; fill: #64748b; }
  </style>

  <!-- Window Container -->
  <rect x="20" y="20" width="1060" height="600" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#windowShadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 30 Q 20 20 30 20 L 1070 20 Q 1080 20 1080 30 L 1080 62 L 20 62 Z" fill="url(#headerGrad)"/>
  <line x1="20" y1="62" x2="1080" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls (Red, Yellow, Green dots) -->
  <circle cx="44" cy="41" r="6" fill="#ef4444"/>
  <circle cx="64" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="41" r="6" fill="#10b981"/>

  <!-- Title in center -->
  <text x="550" y="45" text-anchor="middle" class="font-mono text-title">srv-horizonte-cache — /etc/nginx/sites-available/horizonte-campanas.conf</text>

  <!-- Tag on right -->
  <rect x="940" y="32" width="120" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1000" y="46" text-anchor="middle" class="font-mono" font-size="10" fill="#38bdf8" font-weight="bold" letter-spacing="0.1em">NGINX REVERSE</text>

  <!-- Terminal Content -->
  <g class="font-mono" transform="translate(45, 95)">
    <!-- Shell Prompt Line -->
    <text x="0" y="0">
      <tspan class="text-prompt-user">root</tspan>
      <tspan class="text-prompt-at">@</tspan>
      <tspan class="text-prompt-host">srv-horizonte-cache</tspan>
      <tspan class="text-prompt-at">:</tspan>
      <tspan class="text-prompt-path">/etc/nginx/sites-available</tspan>
      <tspan class="text-prompt-user">#</tspan>
      <tspan class="text-prompt-cmd"> cat horizonte-campanas.conf</tspan>
    </text>

    <!-- Content Lines with Line Numbers -->
    <!-- Line 1 -->
    <text x="-15" y="32" class="text-line-num">1</text>
    <text x="15" y="32" class="text-comment"># Enrutamiento de campañas especiales y micrositios</text>

    <!-- Line 2 -->
    <text x="-15" y="56" class="text-line-num">2</text>
    <text x="15" y="56">
      <tspan class="text-keyword">upstream</tspan>
      <tspan class="text-param"> backend_legacy_cluster {</tspan>
    </text>

    <!-- Line 3 -->
    <text x="-15" y="80" class="text-line-num">3</text>
    <text x="45" y="80" class="text-alert-comment"># ALERTA: IP privada de srv-legacy-2023 (supuestamente congelado)</text>

    <!-- Line 4 -->
    <text x="-15" y="104" class="text-line-num">4</text>
    <text x="45" y="104">
      <tspan class="text-directive">server</tspan>
      <tspan class="text-ip"> 10.10.10.50:8080</tspan>
      <tspan class="text-param"> max_fails=3 fail_timeout=10s</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 5 -->
    <text x="-15" y="128" class="text-line-num">5</text>
    <text x="45" y="128">
      <tspan class="text-directive">keepalive</tspan>
      <tspan class="text-highlight"> 32</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 6 -->
    <text x="-15" y="152" class="text-line-num">6</text>
    <text x="15" y="152" class="text-param">}</text>

    <!-- Line 7 -->
    <text x="-15" y="176" class="text-line-num">7</text>
    <text x="15" y="176" class="text-comment"></text>

    <!-- Line 8 -->
    <text x="-15" y="200" class="text-line-num">8</text>
    <text x="15" y="200">
      <tspan class="text-keyword">server</tspan>
      <tspan class="text-param"> {</tspan>
    </text>

    <!-- Line 9 -->
    <text x="-15" y="224" class="text-line-num">9</text>
    <text x="45" y="224">
      <tspan class="text-directive">listen</tspan>
      <tspan class="text-highlight"> 443</tspan>
      <tspan class="text-param"> ssl http2</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 10 -->
    <text x="-15" y="248" class="text-line-num">10</text>
    <text x="45" y="248">
      <tspan class="text-directive">server_name</tspan>
      <tspan class="text-param"> www.horizonte-ong.org</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 11 -->
    <text x="-15" y="272" class="text-line-num">11</text>
    <text x="45" y="272" class="text-comment"># Tráfico activo hacia el backend viejo en producción</text>

    <!-- Line 12 -->
    <text x="-15" y="296" class="text-line-num">12</text>
    <text x="45" y="296">
      <tspan class="text-keyword">location</tspan>
      <tspan class="text-param"> ^~ /campanas-especiales/ {</tspan>
    </text>

    <!-- Line 13 -->
    <text x="-15" y="320" class="text-line-num">13</text>
    <text x="75" y="320">
      <tspan class="text-directive">proxy_pass</tspan>
      <tspan class="text-highlight"> http://backend_legacy_cluster</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 14 -->
    <text x="-15" y="344" class="text-line-num">14</text>
    <text x="75" y="344">
      <tspan class="text-directive">proxy_set_header</tspan>
      <tspan class="text-param"> Host </tspan>
      <tspan class="text-var">$host</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 15 -->
    <text x="-15" y="368" class="text-line-num">15</text>
    <text x="75" y="368">
      <tspan class="text-directive">proxy_set_header</tspan>
      <tspan class="text-param"> X-Real-IP </tspan>
      <tspan class="text-var">$remote_addr</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 16 -->
    <text x="-15" y="392" class="text-line-num">16</text>
    <text x="75" y="392">
      <tspan class="text-directive">proxy_set_header</tspan>
      <tspan class="text-param"> X-Forwarded-For </tspan>
      <tspan class="text-var">$proxy_add_x_forwarded_for</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 17 -->
    <text x="-15" y="416" class="text-line-num">17</text>
    <text x="75" y="416">
      <tspan class="text-directive">proxy_connect_timeout</tspan>
      <tspan class="text-highlight"> 5s</tspan>
      <tspan class="text-semicolon">;</tspan>
    </text>

    <!-- Line 18 -->
    <text x="-15" y="440" class="text-line-num">18</text>
    <text x="45" y="440" class="text-param">}</text>

    <!-- Line 19 -->
    <text x="-15" y="464" class="text-line-num">19</text>
    <text x="15" y="464" class="text-param">}</text>
  </g>
</svg>
